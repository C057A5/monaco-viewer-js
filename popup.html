<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Monaco Viewer</title>
	<style>
		body {
			background-color: hsl(216deg 8% 88%);
			cursor: default;
			padding: 0;
			margin: 0;
			width: 500px;
		}

		section {
			text-align: center;
			padding: 0 0 5px 0;
		}

		img {
			max-width: 64px;
			max-height: 64px;
			vertical-align: middle;
			margin: 10px 20px 10px -60px;
		}

		table {
			border-spacing: 5px;
			width: 100%;
			text-align: left;
		}

		input, textarea {
			box-sizing: border-box;
			vertical-align: top;
		}

		td {
			box-sizing: border-box;
			height: 21px;
			padding: 0 10px;
			vertical-align: top;
		}

			td[colspan] {
				text-align: center;
			}

		.hdr {
			background-color: #00000020;
			border-radius: 6px;
			font-size: 14pt;
			font-weight: bold;
			margin: 0 -10px 10px -10px;
			position: relative;
		}

		td, input, button {
			white-space: nowrap;
			font-family: 'Segoe UI', sans-serif;
			font-weight: normal;
			font-size: 10pt;
		}

			td.label {
				padding-top: 3px;
			}

		button {
			padding: 5px 20px;
			border-color: #aaa;
			border-width: 1px;
			border-style: solid;
			border-radius: 3px;
			background-color: #00000020;
		}

		input[type=text] {
			width: 100%;
		}

		input[type=text], input[type=number] {
			border-color: #ccc;
			border-width: 1px;
			border-style: solid;
			padding: 2px 4px;
			border-radius: 3px;
		}

		input:focus, button:focus, #contentTypes:focus {
			outline: none;
			box-shadow: 0 0 5px 1px #22a6f2;
		}


		input[type=number] {
			width: 80px;
		}

		select {
			width: 100px;
			border: 1px solid #ccc;
			border-radius: 3px;
			padding: 2px 2px;
			background: #fff;
			font-family: 'Segoe UI', sans-serif;
			font-size: 10pt;
			vertical-align: top;
		}

			select:focus {
				outline: none;
				box-shadow: 0 0 5px 1px #22a6f2;
			}

		input::-webkit-inner-spin-button {
			margin: -1px -2px -2px 8px;
		}

		input::-webkit-calendar-picker-indicator {
			position: relative;
			top: -2px;
		}

		a.home {
			position: absolute;
			bottom: 10px;
			right: 15px;
			font-size: 16px;
			font-weight: normal;
		}

		#contentTypes {
			background: #fff;
			border-color: #ccc;
			border-width: 1px;
			border-style: solid;
			padding: 2px 4px;
			border-radius: 3px;
			outline: none;
			cursor: text;
			overflow: auto;
			min-width: 260px;
			width: 100%;
			box-sizing: border-box;
			resize: vertical;
			font-family: 'Segoe UI', sans-serif;
			font-size: 10pt;
		}

	</style>
</head>

<body>
	<section>
		<datalist id="themes">
			<option value="vs-light" />
			<option value="vs-dark" />
			<option value="hc-light" />
			<option value="hc-black" />
		</datalist>
		<datalist id="fonts">
			<option value="Cascadia Code" />
			<option value="Consolas" />
			<option value="Courier New" />
			<option value="DejaVu Sans Mono" />
			<option value="Droid Sans Mono" />
			<option value="Fira Code" />
			<option value="Iosevka" />
			<option value="Liberation Mono" />
			<option value="Menlo" />
			<option value="Monaco" />
			<option value="Noto Sans Mono" />
			<option value="Noto Sans Mono Condensed" />
			<option value="PragmataPro" />
			<option value="Roboto Mono" />
			<option value="Source Code Pro" />
			<option value="Ubuntu Mono" />
		</datalist>
		<table>
			<tr>
				<td colspan="2">
					<div class="hdr">
						<img src="/resources/icon-128.png" alt="Monaco Viewer" />
						<span>Monaco Viewer</span>
						<a href="https://github.com/C057A5/monaco-viewer-js" class="home" target="_blank">🏠</a>
					</div>
				</td>
			</tr>
			<tr title="Editor color theme.&#10;Examples: vs (light, the default when empty), vs-dark, hc-light, hc-black.">
				<td class="label">Theme:</td>
				<td><input type="text" spellcheck="false" id="theme" list="themes" /></td>
			</tr>
			<tr title="CSS font family list; the first installed font is used.&#10;Examples: Consolas; 'Cascadia Code', Consolas, monospace; Fira Code.">
				<td class="label">Font family:</td>
				<td><input type="text" spellcheck="false" id="fontFamily" list="fonts" /></td>
			</tr>
			<tr title="Font ligatures (e.g. => shown as an arrow, in fonts that have them).&#10;Empty or true: on. false: off.&#10;Or CSS font-feature-settings, e.g. 'calt', 'ss01' or 'liga' 0.">
				<td class="label">Font ligatures:</td>
				<td><input type="text" spellcheck="false" id="fontLigatures" /></td>
			</tr>
			<tr title="Font size in pixels.&#10;Examples: 12, 14. Ctrl+mouse wheel zooms in the editor.">
				<td class="label">Font size:</td>
				<td><input type="number" id="fontSize" /></td>
			</tr>
			<tr title="Font weight, 100 (thin) to 900 (black).&#10;Examples: 400 normal, 300 light, 700 bold.">
				<td class="label">Font weight:</td>
				<td><input type="number" id="fontWeight" step="100" min="100" max="900" /></td>
			</tr>
			<tr title="Maximum number of folding regions computed per document.&#10;Large documents beyond it cannot be folded completely; higher values are slower.&#10;Examples: 10000 (default), 50000 for very large documents.">
				<td class="label">Folding maximum regions:</td>
				<td><input type="number" id="foldingMaximumRegions" step="1000" min="1000" max="50000" /></td>
			</tr>
			<tr title="Show line numbers.">
				<td class="label">Line numbers:</td>
				<td><input type="checkbox" id="lineNumbers" /></td>
			</tr>
			<tr title="Prevent editing the document.&#10;Formatting, join lines and escape/unescape still work.">
				<td class="label">Read-only:</td>
				<td><input type="checkbox" id="readOnly" /></td>
			</tr>
			<tr title="Format the document after loading (Format document, Alt+Shift+F).&#10;JSON, XML, JavaScript and CSS; YAML has no formatter.">
				<td class="label">Format on load:</td>
				<td><input type="checkbox" id="formatOnLoad" /></td>
			</tr>
			<tr title="Fold the document to this level after loading, like the Fold level buttons.&#10;0 (default): no folding. 1: everything folded. 2: top-level content visible, deeper levels folded. 7: almost everything unfolded.">
				<td class="label">Fold level on load:</td>
				<td>
					<select id="foldLevelOnLoad">
						<option value="0">No folding</option>
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
						<option value="4">4</option>
						<option value="5">5</option>
						<option value="6">6</option>
						<option value="7">7</option>
					</select>
				</td>
			</tr>
			<tr title="Content types to open in the viewer, one per line.&#10;Examples: text/plain, application/json, application/yaml, application/xml, text/csv.&#10;Types the browser downloads or renders itself (YAML, XML, ...) are converted to text for the viewer.">
				<td class="label">Content types:</td>
				<td><textarea id="contentTypes" spellcheck="false" rows="8" wrap="off"></textarea></td>
			</tr>
			<tr>
				<td colspan="2"><hr /></td>
			</tr>
			<tr>
				<td colspan="2"><button id="save">Save Settings</button></td>
			</tr>
		</table>
	</section>
	<script src="scripts/defaults.js"></script>
	<script src="scripts/popup.js"></script>
</body>

</html>
